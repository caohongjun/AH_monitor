# 临时测试：验证 GitHub Actions 上能否访问 Product Hunt
name: Test PH Access

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 测试 requests 访问 PH leaderboard
        run: |
          python -c "
          import requests
          from datetime import datetime, timedelta
          y = datetime.utcnow() - timedelta(days=1)
          url = f'https://www.producthunt.com/leaderboard/daily/{y.year}/{y.month}/{y.day}'
          r = requests.get(url, timeout=20, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'})
          print('Status:', r.status_code)
          print('Cloudflare?', 'Just a moment' in r.text)
          print('Has products?', '/products/' in r.text)
          print('Length:', len(r.text))
          "
      - name: 安装 Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: 测试 Playwright 访问 PH leaderboard
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          from datetime import datetime, timedelta
          import time
          y = datetime.utcnow() - timedelta(days=1)
          url = f'https://www.producthunt.com/leaderboard/daily/{y.year}/{y.month}/{y.day}'
          print('URL:', url)
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, timeout=45000, wait_until='domcontentloaded')
              for _ in range(15):
                  time.sleep(2)
                  c = page.content()
                  if 'Just a moment' not in c and len(c) > 50000:
                      break
              print('Title:', page.title())
              print('CF?', 'Just a moment' in page.content())
              text = page.inner_text('body')
              print('Body len:', len(text))
              print(text[:1500])
              browser.close()
          "
